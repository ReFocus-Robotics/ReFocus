# ReFocus fast profile with 64 training environments on 16 GPUs.
# The coordinator runs three rounds of 25 Global and 25 Local PPO updates.
# Keep hydra.searchpath in this primary config for the pinned RLinf runtime.
defaults:
- env/robocasa365_composite_seen@env.train
- env/robocasa365_composite_seen@env.eval
- model/pi0_5_robocasa365@actor.model
- training_backend/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 2
  component_placement:
    actor: 0-15
    env,rollout: all
runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: robocasa_rsi
    logger_backends:
    - tensorboard
  max_epochs: 150
  max_steps: 150
  only_eval: false
  val_check_interval: 5
  save_interval: 5
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 2
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1
env:
  group_name: EnvGroup
  train:
    total_num_envs: 64
    max_episode_steps: 2900
    max_steps_per_rollout_epoch: 2900
    reward_coef: ${algorithm.reward_coef}
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: false
    rldx_robocasa_split: target
    done_shift:
      enabled: true
    dense_reward:
      enabled: true
    video_cfg:
      save_video: false
    auto_reset: false
    ignore_terminations: false
  eval:
    max_steps_per_rollout_epoch: 2900
    total_num_envs: 80
    auto_reset: true
    ignore_terminations: true
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: true
    rldx_robocasa_split: target
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval
    is_eval: true
rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  unnorm_key: robocasa365
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:PI05_SFT_CKPT}
    precision: ${actor.model.precision}
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 128
  seed: 1234
  enable_offload: false
  model:
    model_path: ${oc.env:PI05_SFT_CKPT}
    model_type: openpi
    add_value_head: true
    num_action_chunks: 50
    num_steps: 10
    openpi:
      value_after_vlm: true
      detach_critic_input: true
  optim:
    lr: 5.0e-06
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: false
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: false
critic:
  use_critic_model: false
